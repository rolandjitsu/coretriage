[package]
name = "coretriage-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Offline triage of Linux ELF core dumps: parse, unwind, symbolicate, and bucket crashes and hangs."
keywords = ["coredump", "elf", "debugging", "crash", "backtrace"]
categories = ["development-tools::debugging", "command-line-utilities"]
readme = "README.md"

[package.metadata.docs.rs]
# Build the full API on docs.rs, including every optional feature.
all-features = true

[features]
# Fetch missing binaries and debuginfo by build-id from a debuginfod server. Off by default so
# the base build is offline and does not pull `ureq`.
debuginfod = ["dep:ureq"]

[dependencies]
object.workspace = true
gimli.workspace = true
addr2line.workspace = true
framehop.workspace = true
memmap2.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
blake3.workspace = true
cpp_demangle.workspace = true
rustc-demangle.workspace = true
tracing.workspace = true
ureq = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
flate2.workspace = true

[[bench]]
name = "triage"
harness = false
